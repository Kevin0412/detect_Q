name: Render gallery
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**.py'
      - 'data/**'
      - 'templates/**'
      - '.github/workflows/render-gallery.yml'
permissions:
  contents: write
concurrency:
  group: render-gallery
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install numpy opencv-python-headless matplotlib Pillow
          python scripts/render_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: render-gallery
          path: |
            render-output/
            docs/generated/
          if-no-files-found: error
          retention-days: 14
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/preview.webp
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh rendered gallery'
            git push origin HEAD
          fi
